[project]
name = "mcp-agent-reliability-lab"
version = "0.1.0"
description = "Customer-operations LangGraph agent that calls tools only through MCP, with deterministic eval gates, guardrails, and tracing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhay Shagoti" }]
keywords = ["langgraph", "mcp", "evaluation", "guardrails", "fastapi"]
dependencies = [
  "faker>=33.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "langgraph>=1.0.0",
  "mcp>=1.9.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-sdk>=1.28.0",
  "pgvector>=0.3.6",
  "prometheus-client>=0.21.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "redis>=5.2.0",
  "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "locust>=2.32.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
arl-api = "arl.api.cli:main"
arl-eval = "arl.eval.cli:main"
arl-seed = "arl.db.seed:main"
arl-orders-mcp = "arl.mcp.orders:main"
arl-policy-mcp = "arl.mcp.policy:main"
arl-notify-mcp = "arl.mcp.notify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["arl"]
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
  "mcp.*",
  "mcp_types.*",
  "langgraph.*",
  "opentelemetry.*",
  "prometheus_client.*",
  "psycopg.*",
  "pgvector.*",
  "faker.*",
  "jsonschema.*",
  "yaml.*",
  "redis.*",
  "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: requires the docker compose stack",
]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["arl"]
omit = ["arl/api/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
